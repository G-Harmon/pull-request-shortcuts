<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 12px 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1c2128;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
      }
      p.sub {
        margin: 0 0 10px;
        color: #656d76;
        font-size: 12px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid #eaeef2;
      }
      .host {
        font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }
      .tag {
        color: #656d76;
        font-size: 11px;
        white-space: nowrap;
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid #d0d7de;
        background: #f6f8fa;
        padding: 3px 8px;
      }
      button.remove {
        color: #cf222e;
      }
      .add {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .add input {
        flex: 1;
        min-width: 0;
        padding: 4px 6px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        font: inherit;
      }
      .add button {
        background: #1f883d;
        color: #fff;
        border-color: #1f883d;
      }
      .msg {
        margin-top: 8px;
        font-size: 12px;
        min-height: 1.2em;
      }
      .msg.err {
        color: #cf222e;
      }
      .msg.ok {
        color: #1a7f37;
      }
    </style>
  </head>
  <body>
    <h1>PR Review Shortcuts</h1>
    <p class="sub">Sites where the shortcuts are active.</p>
    <ul id="hosts"></ul>
    <div class="add">
      <input
        id="host"
        type="text"
        placeholder="git.example.com"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="add" type="button">Add</button>
    </div>
    <div id="msg" class="msg"></div>
    <script src="popup.js"></script>
  </body>
</html>
